<!-- Primary Meta Tags -->
{{ if .IsHome }}
<title>Rez's Blog</title>
<meta name="title" content="Rez's Blog" />
<meta name="description" content="My personal blogsite." />
{{ else }}
<title>{{ .Title }} | Rez's Blog</title>
<meta name="title" content="{{ .Title }} | Rez's Blog" />
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}My personal blogsite.{{ end }}" />
{{ end }}

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:title" content="{{ if .IsHome }}Rez's Blog{{ else }}{{ .Title }} | Rez's Blog{{ end }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}My personal blogsite.{{ end }}" />
<meta property="og:image" content="https://metatags.io/images/meta-tags.png" />

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:url" content="{{ .Permalink }}" />
<meta property="twitter:title" content="{{ if .IsHome }}Rez's Blog{{ else }}{{ .Title }} | Rez's Blog{{ end }}" />
<meta property="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}My personal blogsite.{{ end }}" />
<meta property="twitter:image" content="https://metatags.io/images/meta-tags.png" />

<!-- Meta Tags Generated with https://metatags.io -->
